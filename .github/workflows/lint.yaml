# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: lint.yaml

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          # rxode2 5.1.6 (the current CRAN/RSPM build) is broken by lotri 1.0.5,
          # released 2026-09-11: rxode2:::.addVariableToIniDf() rbind()s an iniDf row
          # whose column count no longer matches, so any ini() edit dies with
          # "numbers of columns of arguments do not match". 5.1.6 declares only
          # lotri (>= 1.0.4), so the broken pair resolves happily. rxode2 5.1.7 is
          # the fix (it requires lotri >= 1.0.5) but is not on CRAN yet, so take it
          # from the nlmixr2 r-universe. Drop this once 5.1.7 reaches CRAN.
          extra-repositories: https://nlmixr2.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
