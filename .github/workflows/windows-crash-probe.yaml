# Diagnostic only; this branch is never merged. On windows-latest the R process
# dies with a segfault in test-checkModelConventions.R, at the first
# rxModelVars() call that hands rxode2's parser a model it must reject. macOS
# and Linux pass. Each job installs rxode2 alone and replays that mix of parses
# in a loop (.github/scripts/probe-parse-errors.R), printing each parse before
# it starts, so the log shows the parse that killed R:
#   - runiverse: the r-universe development binaries, as CI installs them;
#   - cran: CRAN's rxode2 5.1.8 binaries, to tell a development regression
#     from an older bug;
#   - runiverse-gdb: the r-universe binaries under gdb, for a backtrace.
on:
  push:
    branches: ['ci-probe/windows-crash-*']

name: windows-crash-probe

permissions: read-all

jobs:
  probe:
    runs-on: windows-latest
    name: windows probe (${{ matrix.source }})
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        source: [runiverse, cran, runiverse-gdb]
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: false

      - name: Install rxode2
        shell: Rscript {0}
        run: |
          src <- "${{ matrix.source }}"
          repos <- c(CRAN = "https://cloud.r-project.org")
          if (startsWith(src, "runiverse")) repos <- c(nlmixr2 = "https://nlmixr2.r-universe.dev", repos)
          options(repos = repos)
          install.packages("rxode2", type = "binary")
          print(utils::packageDescription("rxode2")[c("Version", "RemoteSha", "Repository", "Built")])

      - name: Replay the parses
        if: matrix.source != 'runiverse-gdb'
        shell: bash
        run: Rscript .github/scripts/probe-parse-errors.R 40

      - name: Install gdb (MSYS2 ucrt64)
        if: matrix.source == 'runiverse-gdb'
        shell: bash
        run: |
          /c/msys64/usr/bin/pacman -Sy --noconfirm --needed mingw-w64-ucrt-x86_64-gdb
          /c/msys64/ucrt64/bin/gdb.exe --version | head -1

      - name: Replay the parses under gdb
        if: matrix.source == 'runiverse-gdb'
        shell: bash
        run: |
          RTERM="$(Rscript -e 'cat(file.path(R.home("bin"), "Rterm.exe"))')"
          echo "Rterm: $RTERM"
          /c/msys64/ucrt64/bin/gdb.exe -batch \
            -ex "set pagination off" \
            -ex "handle SIGSEGV stop print" \
            -ex run \
            -ex "bt 40" \
            -ex "info sharedlibrary" \
            --args "$RTERM" --vanilla --no-echo -f .github/scripts/probe-parse-errors.R --args 40
