# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# SHARDED BUILD. A GitHub-hosted runner has 4 vCPUs, so a single job renders
# articles 4-wide and no faster. At ~1500 articles that is a ~5 h job against
# GitHub's 6 h hard limit -- the build was heading for a timeout failure rather
# than a content failure.
#
# So `render` fans out over PKGDOWN_SHARDS runners, each rendering an
# interleaved slice (see .github/scripts/pkgdown-parallel-build.R), and
# `assemble` downloads every shard's docs/, builds the non-article sections
# once over the combined output, and deploys.
# Stacked PRs (based on another PR's branch) skip CI; a PR runs once it
# targets main, including when it is retargeted there (edited, base
# changed).  Other PR edits start a run whose jobs are all skipped.
on:
  push:
    branches: [main, master]
  # PR checks run only when a reviewer approves with the phrase
  # "ready to be merged" (pushes to a PR branch no longer start CI).
  pull_request_review:
    types: [submitted]
  # Maintainers can also start PR checks by commenting "/ci" on the PR.
  issue_comment:
    types: [created]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

# One in-flight pkgdown run per ref. A new push to a PR CANCELS the superseded
# run -- every render shard and the assemble job together, since the group
# is workflow-level. Before this, the group embedded github.run_id on pull
# requests, which made every run its own group: superseded runs kept going and
# several ~90 min builds ran concurrently against the same PR.
#
# Pushes to main / releases deliberately do NOT cancel: that path deploys to
# gh-pages, and interrupting it half-way would publish a partial site. Those
# runs queue behind each other instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}${{ ((github.event_name == 'pull_request_review' && !(github.event.review.state == 'approved' && contains(github.event.review.body, 'ready to be merged'))) || (github.event_name == 'issue_comment' && !(github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'issue_comment') }}

env:
  # Number of runner jobs the article render fans out over. Keep the matrix
  # below in sync -- GitHub cannot compute a matrix from an expression here.
  # Six since 2026-09: at ~2,300 articles each of four shards took 100-115
  # min; per-shard setup is ~2 min, so rendering time falls almost in
  # proportion. The assemble job (~30-40 min) is the floor more shards cannot
  # lower.
  PKGDOWN_SHARDS: "6"

jobs:
  render:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && github.event_name != 'issue_comment') || github.event.action != 'edited' || github.event.changes.base) && ((github.event_name != 'pull_request_review' && github.event_name != 'issue_comment') || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(github.event.review.body, 'ready to be merged') && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref)) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    # statuses: write lets a /ci run report back to the PR
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
      discussions: read
      issues: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: write
    runs-on: ubuntu-latest
    strategy:
      # Surface EVERY failing shard in one round. With fail-fast the first
      # broken article cancels its siblings and the next failure is only found
      # on the following CI round -- painful on a repo that merges vignettes
      # in large batches.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Parallel article rendering knob, consumed by
      # .github/scripts/pkgdown-parallel-build.R. Leave blank to use
      # parallel::detectCores(); set to a positive integer to override
      # (e.g. "16" to cap memory on a 32-core larger runner).
      PKGDOWN_WORKERS: ""
      # PKGDOWN_SHARDS is inherited from the workflow-level env above.
      PKGDOWN_SHARD: ${{ matrix.shard }}
    steps:
      - name: Report /ci run to the PR (pending)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: render (${{ join(matrix.*, ', ') }})
        with:
          script: |
            const pr = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.exportVariable('CI_PR_HEAD_SHA', pr.data.head.sha);
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.data.head.sha,
              state: 'pending', context: process.env.CI_CONTEXT, description: '/ci run in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          # DESCRIPTION requires rxode2 (>= 5.1.8). 5.1.7 is the first release that
          # works with lotri 1.0.5, but it still defaults useLinCmt=TRUE, and the
          # ODE-to-linCmt conversion that flag enables segfaults intermittently
          # inside rxode2's parser (nested parse over shared global state) --
          # it took out a pkgdown render shard on Stroh_2013_rolofylline. 5.1.8
          # defaults that flag to FALSE. It is r-universe-only for now, so this
          # repository is load-bearing until 5.1.8 reaches CRAN/RSPM.
          extra-repositories: https://nlmixr2.r-universe.dev
          use-public-rspm: true

      # r-universe rebuilds rxode2 under a FIXED version string, and
      # setup-r-dependencies keys its cache on the resolved versions, so a
      # restored cache can carry a build days older than the one pak resolved
      # (2026-09-24: the release legs tested a pre-issue-1381 rxode2 while the
      # freshly compiled legs had the current one). Keying the cache on the
      # current r-universe build time makes every rebuild invalidate it.
      - name: Key the dependency cache on the current r-universe rxode2 build
        id: runiverse
        shell: bash
        run: |
          stamp=$(curl -fsSL --max-time 30 https://nlmixr2.r-universe.dev/api/packages/rxode2 | jq -r '._created // "unknown"' 2>/dev/null || echo unknown)
          echo "rxode2 r-universe build: $stamp"
          echo "stamp=${stamp//[^0-9A-Za-z]/-}" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3-${{ steps.runiverse.outputs.stamp }}
          extra-packages: any::pkgdown, local::.
          needs: website

      # Fails fast, with a readable message, when the resolved nlmixr2 stack is
      # not mutually compatible -- rather than letting it surface as a crash
      # somewhere far away. See the script's header for the mechanism.
      - name: Verify the installed R package stack is mutually compatible
        run: Rscript .github/scripts/check-r-stack.R

      - name: Render article shard ${{ matrix.shard }}
        run: Rscript .github/scripts/pkgdown-parallel-build.R

      # Only the rendered articles travel between jobs. Everything else in
      # docs/ is regenerated by the assemble job, so shipping it would just
      # cost upload/download time and invite shard-vs-shard conflicts.
      - name: Upload rendered articles
        uses: actions/upload-artifact@v4
        with:
          name: pkgdown-articles-${{ matrix.shard }}
          path: docs/articles
          retention-days: 1
          if-no-files-found: error

      - name: Report /ci run to the PR (result)
        if: always() && github.event_name == 'issue_comment' && env.CI_PR_HEAD_SHA != ''
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: render (${{ join(matrix.*, ', ') }})
          CI_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const s = process.env.CI_JOB_STATUS;
            const state = s === 'success' ? 'success' : s === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: process.env.CI_PR_HEAD_SHA,
              state, context: process.env.CI_CONTEXT, description: `/ci run: ${s}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

  assemble:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && github.event_name != 'issue_comment') || github.event.action != 'edited' || github.event.changes.base) && ((github.event_name != 'pull_request_review' && github.event_name != 'issue_comment') || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(github.event.review.body, 'ready to be merged') && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref)) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    needs: render
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PKGDOWN_WORKERS: ""
      # MUST override the workflow-level PKGDOWN_SHARDS. Workflow env is
      # inherited by every job, so without this the assemble run would shard
      # itself, render a quarter of the articles and quit before building the
      # reference/news/search sections -- deploying a site with no index.
      PKGDOWN_SHARDS: ""
      PKGDOWN_SHARD: ""
      # Build ONLY the non-article sections. The shards already rendered every
      # article and they are restored above; without this the script's
      # unsharded path re-renders all of them, throwing away the sharding.
      PKGDOWN_ASSEMBLE: "1"
    permissions:
      statuses: write
      pull-requests: read
      contents: write
    steps:
      - name: Report /ci run to the PR (pending)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: assemble
        with:
          script: |
            const pr = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.exportVariable('CI_PR_HEAD_SHA', pr.data.head.sha);
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.data.head.sha,
              state: 'pending', context: process.env.CI_CONTEXT, description: '/ci run in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}

      - uses: r-lib/actions/setup-pandoc@v2

      # Same repositories as the render jobs. Without these this job resolved
      # from the default CRAN mirror alone, so it could install a different
      # rxode2 than the shards whose output it is assembling -- and CRAN does
      # not carry the rxode2 (>= 5.1.8) DESCRIPTION asks for.
      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: https://nlmixr2.r-universe.dev
          use-public-rspm: true

      # r-universe rebuilds rxode2 under a FIXED version string, and
      # setup-r-dependencies keys its cache on the resolved versions, so a
      # restored cache can carry a build days older than the one pak resolved
      # (2026-09-24: the release legs tested a pre-issue-1381 rxode2 while the
      # freshly compiled legs had the current one). Keying the cache on the
      # current r-universe build time makes every rebuild invalidate it.
      - name: Key the dependency cache on the current r-universe rxode2 build
        id: runiverse
        shell: bash
        run: |
          stamp=$(curl -fsSL --max-time 30 https://nlmixr2.r-universe.dev/api/packages/rxode2 | jq -r '._created // "unknown"' 2>/dev/null || echo unknown)
          echo "rxode2 r-universe build: $stamp"
          echo "stamp=${stamp//[^0-9A-Za-z]/-}" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3-${{ steps.runiverse.outputs.stamp }}
          extra-packages: any::pkgdown, local::.
          needs: website

      # Fails fast, with a readable message, when the resolved nlmixr2 stack is
      # not mutually compatible -- rather than letting it surface as a crash
      # somewhere far away. See the script's header for the mechanism.
      - name: Verify the installed R package stack is mutually compatible
        run: Rscript .github/scripts/check-r-stack.R

      - name: Download every shard's articles
        uses: actions/download-artifact@v4
        with:
          pattern: pkgdown-articles-*
          merge-multiple: true
          path: docs/articles

      # pkgdown's lazy check skips an article when its .html is newer than its
      # .Rmd. actions/download-artifact does NOT preserve mtimes, so make the
      # restored HTML unambiguously newer rather than relying on whatever
      # timestamp the download happens to leave behind. Without this the
      # assemble job silently re-renders all ~1500 articles and the sharding
      # buys nothing -- and it would still go green, so it would not be noticed.
      - name: Mark restored articles as up to date
        run: find docs/articles -name '*.html' -exec touch {} +

      - name: Verify every article arrived
        run: |
          expected=$(Rscript -e 'p <- pkgdown::as_pkgdown("."); cat(sum(p$vignettes$type == "rmd"))')
          actual=$(find docs/articles -maxdepth 1 -name '*.html' | wc -l)
          echo "articles expected=$expected present=$actual"
          if [ "$actual" -lt "$expected" ]; then
            echo "::error::only $actual of $expected articles were restored from the shards"
            exit 1
          fi

      - name: Build non-article sections
        run: Rscript .github/scripts/pkgdown-parallel-build.R

      - name: Deploy to GitHub pages 🚀
        if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && github.event_name != 'issue_comment')
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

      - name: Report /ci run to the PR (result)
        if: always() && github.event_name == 'issue_comment' && env.CI_PR_HEAD_SHA != ''
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: assemble
          CI_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const s = process.env.CI_JOB_STATUS;
            const state = s === 'success' ? 'success' : s === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: process.env.CI_PR_HEAD_SHA,
              state, context: process.env.CI_CONTEXT, description: `/ci run: ${s}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
