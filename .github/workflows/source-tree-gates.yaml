# Runs the tests that read the package source tree (_pkgdown.yml,
# vignettes/articles/, .claude/, R/, inst/references/) from the checkout. R CMD
# check and covr run the tests against an installed copy, where those files are
# absent and the tests skip; here they must run, and any skip fails the job.
# See .github/scripts/run-source-tree-tests.R for which files and why.
#
# Stacked PRs (based on another PR's branch) skip CI; a PR runs once it
# targets main, including when it is retargeted there (edited, base
# changed).  Other PR edits start a run whose jobs are all skipped.
on:
  push:
    branches: [main, master]
  # PR checks run only when a reviewer approves with the phrase
  # "ready to be merged" (pushes to a PR branch no longer start CI).
  pull_request_review:
    types: [submitted]
  # Maintainers can also start PR checks by commenting "/ci" on the PR.
  issue_comment:
    types: [created]
  # Run by hand on any branch: Actions tab -> Run workflow, or `gh workflow run`.
  workflow_dispatch:

name: source-tree-gates.yaml

permissions: read-all

# One in-flight run per workflow per ref; see lint.yaml for the reasoning.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}${{ ((github.event_name == 'pull_request_review' && !(github.event.review.state == 'approved' && contains(github.event.review.body, 'ready to be merged'))) || (github.event_name == 'issue_comment' && !(github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))) && format('-noop-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  source-tree-gates:
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_review' && github.event_name != 'issue_comment') || github.event.action != 'edited' || github.event.changes.base) && ((github.event_name != 'pull_request_review' && github.event_name != 'issue_comment') || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && contains(github.event.review.body, 'ready to be merged') && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref)) || (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ci') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    # statuses: write lets a /ci run report back to the PR
    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
      discussions: read
      issues: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: read
      statuses: write
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Report /ci run to the PR (pending)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: source-tree-gates
        with:
          script: |
            const pr = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.exportVariable('CI_PR_HEAD_SHA', pr.data.head.sha);
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.data.head.sha,
              state: 'pending', context: process.env.CI_CONTEXT, description: '/ci run in progress',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || '' }}

      - uses: r-lib/actions/setup-r@v2
        with:
          # rxode2 (>= 5.1.8) is r-universe-only for now; see R-CMD-check.yaml.
          extra-repositories: https://nlmixr2.r-universe.dev
          use-public-rspm: true

      # Key the dependency cache on the current r-universe rxode2 build, which
      # r-universe rebuilds under a fixed version string; see R-CMD-check.yaml.
      - name: Key the dependency cache on the current r-universe rxode2 build
        id: runiverse
        shell: bash
        run: |
          stamp=$(curl -fsSL --max-time 30 https://nlmixr2.r-universe.dev/api/packages/rxode2 | jq -r '._created // "unknown"' 2>/dev/null || echo unknown)
          echo "rxode2 r-universe build: $stamp"
          echo "stamp=${stamp//[^0-9A-Za-z]/-}" >> "$GITHUB_OUTPUT"

      # The tests load the package from the checkout (testthat::test_local()),
      # so only its dependencies are installed, Suggests included.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3-${{ steps.runiverse.outputs.stamp }}

      - name: Verify the installed R package stack is mutually compatible
        run: Rscript .github/scripts/check-r-stack.R

      - name: Run the source-tree tests from the checkout
        run: Rscript .github/scripts/run-source-tree-tests.R

      - name: Report /ci run to the PR (result)
        if: always() && github.event_name == 'issue_comment' && env.CI_PR_HEAD_SHA != ''
        uses: actions/github-script@v7
        env:
          CI_CONTEXT: source-tree-gates
          CI_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const s = process.env.CI_JOB_STATUS;
            const state = s === 'success' ? 'success' : s === 'failure' ? 'failure' : 'error';
            await github.rest.repos.createCommitStatus({ ...context.repo, sha: process.env.CI_PR_HEAD_SHA,
              state, context: process.env.CI_CONTEXT, description: `/ci run: ${s}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
