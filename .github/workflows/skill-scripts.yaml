# Runs the offline tests for the scripts under .claude/skills. `.claude` is in
# .Rbuildignore, so R CMD check and the package's testthat suite never see
# these scripts; this workflow is the only automated run of their tests.
# Stacked PRs (based on another PR's branch) skip CI; a PR runs once it
# targets main, including when it is retargeted there (edited, base
# changed).  Other PR edits start a run whose jobs are all skipped.
on:
  push:
    branches: [main, master]
    paths:
      - ".claude/skills/**"
      - ".github/workflows/skill-scripts.yaml"
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, edited]
    paths:
      - ".claude/skills/**"
      - ".github/workflows/skill-scripts.yaml"

name: skill-scripts.yaml

permissions: read-all

# One in-flight run per workflow per ref. A new push to a pull request -- a
# fresh commit, or `main` merged in -- CANCELS the run it superseded instead of
# leaving two answers to the same question racing each other for runners.
#
# Unlike pkgdown.yaml this cancels on `main` too: nothing here deploys, so an
# interrupted run leaves nothing half-written, and the newer push that caused
# the cancellation always runs the same checks to completion.
#
# This only covers runs superseded by a LATER PUSH. Merging a pull request
# pushes nothing to refs/pull/N/merge, so its checks are not superseded and run
# on regardless; cancel-on-merge.yaml handles that case.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  skill-scripts:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # acquire-paper.R checks a download's first page with pdftotext, and its
      # test needs it too; curl is already on the runner image.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install jsonlite
        run: |
          install.packages("jsonlite")
          stopifnot(requireNamespace("jsonlite", quietly = TRUE))
        shell: Rscript {0}

      # The test exits 1 on any failed check, which fails the step.
      - name: Test acquire-paper.R
        run: Rscript .claude/skills/extract-literature-model/scripts/test-acquire-paper.R
