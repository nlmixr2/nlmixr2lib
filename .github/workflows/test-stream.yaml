# Diagnostic twin of R-CMD-check.yaml for the two Linux legs that build rxode2
# from source (devel, oldrel-1). Since the 2026-09-17 consolidation those legs
# have died ~33 minutes into `Running 'testthat.R'` with "The runner has
# received a shutdown signal" (exit 143) on every push to main and every PR,
# while the release legs pass. R CMD check buffers test output until the tests
# finish, and a shutdown skips the artifact upload, so nothing about the death
# has ever reached a log. This workflow runs the same test suite with a
# streaming reporter and a once-a-minute memory/disk monitor so the log shows
# how far the tests got and what the machine looked like when it stopped.
#
# It runs only on manual dispatch and on pushes to the CI-fix branch; it is not
# part of the merge gate.
on:
  workflow_dispatch:
  push:
    branches: [fix/ci-main-green]

name: test-stream.yaml

permissions: read-all

jobs:
  test-stream:
    runs-on: ubuntu-latest
    name: stream tests (${{ matrix.config.r }})
    timeout-minutes: 170

    strategy:
      fail-fast: false
      matrix:
        config:
          - {r: 'devel', http-user-agent: 'release'}
          - {r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true
      TESTTHAT_PROBLEMS: false
      NLMIXR2LIB_SOLVE_GATE_TRACE: 1

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: https://nlmixr2.r-universe.dev
          use-public-rspm: true
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      # r-universe rebuilds rxode2 under a FIXED version string, and
      # setup-r-dependencies keys its cache on the resolved versions, so a
      # restored cache can carry a build days older than the one pak resolved
      # (2026-09-24: the release legs tested a pre-issue-1381 rxode2 while the
      # freshly compiled legs had the current one). Keying the cache on the
      # current r-universe build time makes every rebuild invalidate it.
      - name: Key the dependency cache on the current r-universe rxode2 build
        id: runiverse
        shell: bash
        run: |
          stamp=$(curl -fsSL --max-time 30 https://nlmixr2.r-universe.dev/api/packages/rxode2 | jq -r '._created // "unknown"' 2>/dev/null || echo unknown)
          echo "rxode2 r-universe build: $stamp"
          echo "stamp=${stamp//[^0-9A-Za-z]/-}" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3-${{ steps.runiverse.outputs.stamp }}
          extra-packages: any::rcmdcheck, any::devtools
          needs: check

      - name: Verify the installed R package stack is mutually compatible
        run: Rscript .github/scripts/check-r-stack.R

      - name: Machine and stack at the start
        run: |
          nproc; free -m; df -h / /tmp
          Rscript -e 'cat("Ncpus option:", getOption("Ncpus", NA), " TESTTHAT_CPUS:", Sys.getenv("TESTTHAT_CPUS", "<unset>"), " rxode2 threads:", rxode2::getRxThreads(), "\n")'

      - name: Run the test suite with streaming output and a resource monitor
        shell: bash
        run: |
          set -o pipefail
          ( while true; do
              echo "[monitor $(date -u +%T)] $(free -m | awk '/Mem:/{printf "mem used %d/%d MB", $3, $2}') | $(free -m | awk '/Swap:/{printf "swap used %d/%d MB", $3, $2}') | disk free $(df -h / | awk 'NR==2{print $4}') | tmp $(du -sm "${TMPDIR:-/tmp}" 2>/dev/null | cut -f1) MB | R procs $(pgrep -c -x R) | top: $(ps -eo rss=,pid=,comm= --sort=-rss | head -3 | awk '{printf "%s(%d)=%dMB ", $3, $2, $1/1024}')"
              sleep 60
            done ) &
          MON=$!
          trap 'kill $MON 2>/dev/null || true' EXIT
          Rscript -e 'devtools::load_all(".", quiet = TRUE); r <- testthat::test_local(".", reporter = testthat::ProgressReporter$new(show_praise = FALSE, min_time = 5), stop_on_failure = FALSE); df <- as.data.frame(r); cat(sprintf("\nTESTS DONE pass=%d fail=%d error=%d skip=%d\n", sum(df$passed), sum(df$failed), sum(df$error), sum(df$skipped))); if (sum(df$failed) + sum(df$error) > 0) quit(status = 1)'
