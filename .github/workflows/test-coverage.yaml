# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: test-coverage.yaml

permissions: read-all

# One in-flight run per workflow per ref. A new push to a pull request -- a
# fresh commit, or `main` merged in -- CANCELS the run it superseded instead of
# leaving two answers to the same question racing each other for runners.
#
# Unlike pkgdown.yaml this cancels on `main` too: nothing here deploys, so an
# interrupted run leaves nothing half-written, and the newer push that caused
# the cancellation always runs the same checks to completion.
#
# This only covers runs superseded by a LATER PUSH. Merging a pull request
# pushes nothing to refs/pull/N/merge, so its checks are not superseded and run
# on regardless; cancel-on-merge.yaml handles that case.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          # DESCRIPTION requires rxode2 (>= 5.1.8). 5.1.7 is the first release that
          # works with lotri 1.0.5, but it still defaults useLinCmt=TRUE, and the
          # ODE-to-linCmt conversion that flag enables segfaults intermittently
          # inside rxode2's parser (nested parse over shared global state) --
          # it took out a pkgdown render shard on Stroh_2013_rolofylline. 5.1.8
          # defaults that flag to FALSE. It is r-universe-only for now, so this
          # repository is load-bearing until 5.1.8 reaches CRAN/RSPM.
          extra-repositories: https://nlmixr2.r-universe.dev
          use-public-rspm: true

      # r-universe rebuilds rxode2 under a FIXED version string, and
      # setup-r-dependencies keys its cache on the resolved versions, so a
      # restored cache can carry a build days older than the one pak resolved
      # (2026-09-24: the release legs tested a pre-issue-1381 rxode2 while the
      # freshly compiled legs had the current one). Keying the cache on the
      # current r-universe build time makes every rebuild invalidate it.
      - name: Key the dependency cache on the current r-universe rxode2 build
        id: runiverse
        shell: bash
        run: |
          stamp=$(curl -fsSL --max-time 30 https://nlmixr2.r-universe.dev/api/packages/rxode2 | jq -r '._created // "unknown"' 2>/dev/null || echo unknown)
          echo "rxode2 r-universe build: $stamp"
          echo "stamp=${stamp//[^0-9A-Za-z]/-}" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 3-${{ steps.runiverse.outputs.stamp }}
          extra-packages: any::covr, any::xml2
          needs: coverage

      # Fails fast, with a readable message, when the resolved nlmixr2 stack is
      # not mutually compatible -- rather than letting it surface as a crash
      # somewhere far away. See the script's header for the mechanism.
      - name: Verify the installed R package stack is mutually compatible
        run: Rscript .github/scripts/check-r-stack.R

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}

      - uses: codecov/codecov-action@v5
        with:
          # Fail if error if not on PR, or if on PR and token is given
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          plugins: noop
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Show testthat output
        if: always()
        run: |
          ## --------------------------------------------------------------------
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
